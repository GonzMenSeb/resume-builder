# Resume Generator Configuration
# Copy this file to resume-gen.yaml and customize as needed.
# CLI arguments will override these settings.

# === Output Settings ===
max_pages: 3
max_bullet_words: 40
compile_pdf: true
keep_latex_source: true

# === AI Settings ===
claude_model: opus

# === Design Settings ===
# Available palettes: classic, burgundy, navy, forest, slate, charcoal
color_palette: charcoal

# === Content Settings ===
min_bullets_per_job: 3
max_bullets_per_job: 7
summary_min_words: 50
summary_max_words: 130

# === Language ===
# Supported: en, es, fr, de, pt, it, zh, ja, ko, ar, nl, ru, pl
output_language: en

# === Paths (optional) ===
input_dir: ./tmp/resume_data
output_dir: ./output
target_job_dir: ./tmp/target_job

# === Logging ===
log_level: DEBUG            # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL

# === Adversarial Refinement ===
target_tier: S              # Target grade (S+, S, A+, A, A-, B+, B, etc). If set, enables refinement loop.
# max_refinement_iterations: 5  # Max iterations for refinement (1-10)

# === Advanced ===
# target_keyword_match_rate: 0.70
# tailoring_customization_rate: 0.50
# enable_job_tailoring: true